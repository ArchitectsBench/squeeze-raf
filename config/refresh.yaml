# Screener data-refresh cadences (Phase 2). Tune freely — the refresher reads this live.
# Only BASE timeframes are pulled from Polygon; derived ones are rebuilt locally (no API).
# interval_min = how often to refresh; rth_only = only during 09:30-16:00 ET weekdays;
# after_close = (daily) only run once after the close; lookback_days = incremental window.

universe: common_stocks      # which symbol set to refresh (common_stocks | liquid)

# Every INTRADAY timeframe refreshes every 5 min. We FETCH only the 5min base per symbol and
# DERIVE 15m/30m/1h/2h/3h/4h from it locally (no API) — one 5-min cycle updates the whole
# intraday grid. Just 329 calls/5min (~66/min) vs the 100/min cap → a true 5-min cycle.
# DAILY/multiday stay after-close on purpose: Polygon serves no forming daily bar intraday,
# and the 1d cache is shared with the BACKTESTS — a partial intraday daily bar would be
# look-ahead (CLAUDE.md rule 1). So 1d/2d/3d/4d/1w finalize once, after the close.
base:
  5min: { interval_min: 5,    rth_only: true,  lookback_days: 3 }
  1d:   { interval_min: 1440, rth_only: false, after_close: true, lookback_days: 15 }

derive:
  "5min": [15min, 30min, 1h, 2h, 3h, 4h]   # all intraday tfs rebuilt after each 5min refresh
  "1d":   [2d, 3d, 4d, 1w]                  # multiday rebuilt after the daily (after-close) refresh
